name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Validation on simulated regimes
        run: python scripts/validate_on_simulated.py
      - name: Demo (falls back to simulated prices if the download fails)
        run: python run_demo.py
